[project]
name = "ai78qa-api"
version = "0.1.0"
description = "AI78QA autonomous QA platform API"
requires-python = ">=3.12"
dependencies = ["fastapi>=0.115,<1","uvicorn[standard]>=0.30,<1","sqlalchemy>=2.0,<3","psycopg[binary]>=3.2,<4","alembic>=1.14,<2","pydantic-settings>=2.6,<3","celery[redis]>=5.4,<6","httpx>=0.27,<1","beautifulsoup4>=4.12,<5","scikit-learn>=1.5,<2","numpy>=2.1,<3","python-multipart>=0.0.18,<1"]
[project.optional-dependencies]
test = ["pytest>=8,<9","pytest-asyncio>=0.24,<1","ruff>=0.8,<1","httpx>=0.27,<1"]
[tool.pytest.ini_options]
pythonpath = ["."]
asyncio_mode = "auto"
[tool.ruff]
line-length = 100
target-version = "py312"
