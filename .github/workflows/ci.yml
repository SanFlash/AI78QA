name: AI78QA CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ai78qa-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npm run build:web

  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip
      - run: pip install -e "apps/api[test]"
      - run: pip install -r apps/worker/requirements.txt
      - run: cd apps/api && python -m pytest tests -q
      - run: cd apps/worker && python -m unittest discover -s tests -p "test_*.py" -v

  compose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate local Docker Compose configuration
        run: docker compose --env-file .env.example -f infra/docker-compose.yml config --quiet
