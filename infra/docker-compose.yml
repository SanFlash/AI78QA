services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ai78qa
      POSTGRES_USER: ai78qa
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-ai78qa-local-password}
    ports: ["5432:5432"]
    volumes: [postgres_data:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL","pg_isready -U ai78qa -d ai78qa"]
      interval: 5s
      timeout: 3s
      retries: 10
  redis:
    image: redis:7-alpine
    command: ["redis-server","--appendonly","yes"]
    ports: ["6379:6379"]
    volumes: [redis_data:/data]
    healthcheck:
      test: ["CMD","redis-cli","ping"]
      interval: 5s
      timeout: 3s
      retries: 10
  api:
    build:
      context: ..
      dockerfile: apps/api/Dockerfile
    environment:
      DATABASE_URL: postgresql+psycopg://ai78qa:${POSTGRES_PASSWORD:-ai78qa-local-password}@postgres:5432/ai78qa
      REDIS_URL: redis://redis:6379/0
      CORS_ORIGINS: http://localhost:3000
      EVIDENCE_DIR: /data/evidence
    volumes:
      - evidence_data:/data/evidence:ro
    ports: ["8000:8000"]
    depends_on:
      postgres: {condition: service_healthy}
      redis: {condition: service_healthy}
  worker:
    build:
      context: ..
      dockerfile: apps/worker/Dockerfile
    environment:
      DATABASE_URL: postgresql+psycopg://ai78qa:${POSTGRES_PASSWORD:-ai78qa-local-password}@postgres:5432/ai78qa
      REDIS_URL: redis://redis:6379/0
      EVIDENCE_DIR: /data/evidence
    volumes:
      - evidence_data:/data/evidence
    depends_on:
      postgres: {condition: service_healthy}
      redis: {condition: service_healthy}
    init: true
    shm_size: 1gb
    restart: unless-stopped
  web:
    build:
      context: ..
      dockerfile: apps/web/Dockerfile
      args:
        NEXT_PUBLIC_API_BASE_URL: http://localhost:8000/api/v1
    ports: ["3000:3000"]
    environment:
      NEXT_PUBLIC_API_BASE_URL: http://localhost:8000/api/v1
    depends_on: [api]
volumes:
  postgres_data:
  redis_data:
  evidence_data:
